<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
</head>

<body>
    <div class="agenda-main">
        <div class="sidebar">
            <div class="sidebar-title">
                <img class="app-icon" alt="App Icon" src="./assets/checkbox-marked-circle-auto-outline.svg">
                <span class="app-header">Agenda</span>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-item">
                    <img class="item-icon" alt="Projects Icon" src="./assets/projector-screen-variant-outline.svg">
                    <span class="item-name">Projects</span>
                </div>
                <div class="sidebar-item">
                    <img class="item-icon" alt="Tasks Icon" src="./assets/order-bool-ascending-variant.svg">
                    <span class="item-name">Tasks</span>
                </div>
            </div>
        </div>
        <div class="agenda-content">
            <div class="todo-header">
                <div class="todo-title">
                    <span>Agenda</span>
                </div>
                <div class="search-div">
                    <div class="field-container">
                        <input type="text" name="search-field" placeholder="Search...">

                        <div class="project-btn">
                            <button type="button" id="new-project-btn" class="project-btn">New Project</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="app-content">
                <!-- Empty Projects -->
                <div class="empty-board">
                    <div class="empty-div">
                        <img src="./assets/man.png" alt="Empty Projects" class="empty-img">
                        <div class="empty-text">
                            <span class="empty-msg">Oops!! You don't seem to have created any projects yet.</span>
                            <span class="empty-msg">Click the "New Project" button on top right to get started.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Project Modal -->
    <div id="newProjectModal" class="modal display-none">
        <div class="dialog">
            <div class="header">
                <div class="modal-title">
                    <span>New Project</span>
                </div>
                <div class="close-btn">
                    <span class="close">&times;</span>
                </div>
            </div>
            <div class="body">
                <div class="project-name">
                    <input type="text" name="project-name" placeholder="Name...">
                </div>
                <div class="project-description">
                    <textarea rows="15" cols="10" class="project-description"
                        placeholder="About your project"></textarea>
                </div>
            </div>
            <div class="footer">
                <div class="submit-div">
                    <button type="button" class="submit-btn">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div id="newTaskModal" class="modal display-none">
        <div class="dialog">
            <div class="header">
                <div class="modal-title">
                    <span>Create Task</span>
                </div>
                <div class="close-btn">
                    <span class="close">&times;</span>
                </div>
            </div>
            <div class="body">
                <div class="field-name">
                    <input type="hidden" name="taskProjectId" id="taskProjectId"> 
                    <input type="text" name="task-name" class="task-name" placeholder="Name...">
                </div>
                <div class="task-description">
                    <textarea rows="10" cols="10" class="task-description"
                        placeholder="About your project"></textarea>
                </div>
                <div class="field-name">
                    <label for="task-deadline">Deadline</label>
                    <input type="date" name="task-deadline" class="task-deadline">
                </div>
                <div class="field-name display-flex">
                    <label for="task-completed">Completed?</label>
                    <input type="checkbox" name="task-completed" class="task-completed">
                </div>
            </div>
            <div class="footer">
                <div class="submit-div">
                    <button type="button" class="confirm">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Delete Modal -->
    <div id="projectDeleteModal" class="modal display-none">
        <div class="dialog">
            <div class="header">
                <div class="modal-title">
                    <span>Delete Project </span> <span class="project-name"></span>?
                </div>
                <div class="close-btn">
                    <span class="close">&times;</span>
                </div>
            </div>
            <div class="body">
                <p class="delete-message">
                    Are you sure you want to delete <span class="project-name"></span>?
                    <input type="hidden" id="project-id-input" name="project-id">
                </p>
            </div>
            <div class="footer">
                <div class="footer-btn">
                    <button type="button" class="confirm">Delete</button>
                </div>
            </div>
        </div>
    </div>

            <div class="body">
                <div class="task-list">

            </div>
            <div class="footer">
            </div>
        </div>
    </div> -->
</body>

</html>
